[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "clustaudio"
dynamic = ["version"]
authors = [{ name = "Erdogan Taskesen", email = "erdogant@gmail.com" },]
description = "Python package clustaudio is for unsupervised clustering of audio files using acoustic features, with support for denoising, voice activity detection, and audio separation."
readme = "README.md"
requires-python = "<3.15"
license = "MIT"
keywords = [
    "clustering", 
    "audio", 
    "unsupervised learning", 
    "audio processing",
    "voice activity detection",
    "audio denoising",
    "audio separation",
    "acoustic features",
    "mfcc",
    "spectral features",
    "audio fingerprinting",
    "audio similarity",
    "music information retrieval"
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
    "Intended Audience :: Education",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Developers",
    "Operating System :: Unix",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: MacOS",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Multimedia :: Sound/Audio :: Analysis",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    # Core audio processing
    "librosa>=0.10.0",
    "soundfile>=0.12.0",
    "scipy>=1.9.0",
    "numpy>=1.21.0,<2.0.0",
    
    # Core ML and data science
    "scikit-learn>=1.0.0",
    "pandas>=1.3.0",
    "matplotlib>=3.5.0",
    
    # Clustering and dimensionality reduction
    "pca>=1.5.0",
    "clusteval>=2.0.0",
    "distfit>=1.6.0",
    "scatterd>=1.3.0",
    
    # Utilities
    "tqdm>=4.60.0",
    "datazets>=0.2.0",
    "ismember>=1.0.0",
    "pypickle>=0.1.0",
    
    # Optional metadata support
    "geopy",
    "folium",
    
    # Advanced audio processing features (optional)
    "noisereduce>=2.0.0",       # Advanced noise reduction
    "webrtcvad>=2.0.10",        # Voice activity detection
    "mutagen>=1.45.0",          # Audio metadata extraction
    "tinytag>=1.9.0",           # Lightweight metadata
    "eyed3>=0.9.6",             # MP3 metadata
    "pyacoustid>=1.2.0",        # Audio fingerprinting
]

[project.optional-dependencies]

# Development dependencies
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=3.0.0",
    "sphinx>=4.0.0",
    "sphinx-rtd-theme>=1.0.0",
    "black>=22.0.0",
    "flake8>=4.0.0",
]

# All dependencies
all = [
    "clustaudio[dev]",
]

[project.urls]
Homepage = "https://erdogant.github.io/clustaudio"
Download = "https://github.com/erdogant/clustaudio/archive/{version}.tar.gz"
Documentation = "https://erdogant.github.io/clustaudio"

[tool.setuptools]
packages = ["clustaudio"]
include-package-data = true

[tool.setuptools.dynamic]
version = { attr = "clustaudio.__version__" }
